[workspace]
resolver = "2"
members = ["crates/clan-sdk", "crates/clan-cli", "app/src-tauri"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/saieeshward/clan"
authors = ["Sai Eeshwar", "Shreyansh Soni"]
rust-version = "1.74"
description = "CLAN — Context and Live Agent Notation: a portable file format for agent-readable documents and pipelines."
keywords = ["clan", "agent", "ai", "document", "pipeline"]
categories = ["encoding", "file-formats", "parser-implementations"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
jsonschema = "0.26"
lol_html = "2.1.0"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
