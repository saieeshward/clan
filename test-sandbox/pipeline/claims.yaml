# CLAN claims & shortcomings registry — the single source of truth for what the
# pipeline must prove on every run. Each entry maps a claim to the stage that
# tests it, the metric, and the pass threshold. scorecard.mjs (inside
# pipeline.mjs stage 3) reads this file and emits scorecard.json/md + history.
#
# status is NOT stored here — it is computed per run. `expect: red` marks a
# known shortcoming we are tracking toward green (regression if it goes
# red->green->red).

version: 1
claims:
  # ---- format / correctness claims (deterministic, stage 1) ----
  - id: C-CORE
    claim: "Core lifecycle works: create, validate, read, info, patch, export"
    stage: conformance
    tests: [T01, T02, T03, T04, T12, T18, T19, T21, T22]
    threshold: all pass

  - id: C-PROVENANCE
    claim: "Every mutation is attributable: patch commands require agent/action (or explicit --no-decision); fields_changed computed from the patch"
    stage: conformance
    tests: [T05, T06, T07]
    threshold: all pass
    note: "F15. The benchmark cross-check is C-PROV-E2E."

  - id: C-FORK-MERGE
    claim: "Parallel fan-out is safe by construction: namespace isolation enforced, conflicts detected with provenance, policies fold deterministically"
    stage: conformance
    tests: [T13, T14, T15, T16, T17]
    threshold: all pass

  - id: C-AGENT-ERGONOMICS
    claim: "Agents don't trip on the CLI: inline JSON, --set, --append, BOM tolerance, skip-guide, read aliases"
    stage: conformance
    tests: [T04, T08, T09, T10, T21]
    threshold: all pass
    note: "F13, F14, F3, F12"

  - id: C-HINTS-CORRECT
    claim: "Teaching hints are never wrong: no stale-view hint when patched keys are data-bound in the view"
    stage: conformance
    tests: [T20]
    threshold: all pass
    expect: red          # F2b designed, not yet implemented (pack.rs:333 unconditional stale)

  # ---- token-efficiency claims (deterministic, stage 1 / TESTBOOK D-*) ----
  - id: C-TOON
    claim: "TOON encoding saves >=30% vs minified JSON on uniform/tabular data (prose number published as measured, no threshold)"
    stage: conformance
    tests: [D-TOON]
    threshold: "uniform >= 30% saving"
    note: "research/12 ~40% claim, honestly bounded per data shape. 2026-06-11: columnar encoding for uniform scalar-object arrays landed (toon.rs) — measured 57.1% vs minified JSON on a 20x5 table via `read agent --skip-guide`. Prose still falls back to row form (publish that number with no threshold)."

  - id: C-SCAFFOLD
    claim: "CLAN's fixed injection scaffolding is bounded: skip-guide intercept <= 3,000 chars regardless of document size"
    stage: conformance
    tests: [D-INJECT]
    threshold: "intercept a <= 3000 chars"
    note: "the amortization story from research/15; measured over the snapshot corpus. 2026-06-11: PASS at a=2973 chars (slope b=1.173 chars/data-char) over the 41-file uniform-guide corpus. Close to the bound — watch for regression."

  - id: C-GUIDE-STABLE
    claim: "spec/agent-guide.md is byte-identical across all files and hops (prompt-cache precondition)"
    stage: conformance
    tests: [D-INJECT]
    threshold: "1 unique hash across corpus"
    note: "2026-06-11: PASS — 1 distinct hash (3b0caac5) across all 41 corpus snapshots; guide-skip delta spread 0. The guide is a static include_bytes! of spec/agent-guide.md (no dynamic content), so byte-stability holds per binary version. The corpus previously mixed 3 versions (pre/post-F15 guide growth: 7599/8127/8840 bytes); snapshots were refreshed to the current guide deterministically (static spec entries rewritten, agent content untouched) rather than re-running every flow."

  - id: C-CHAIN-COMPRESS
    claim: "Decision-chain two-tier compression: verbatim window intact, tail rationales compressed, pinned never compressed, all other fields verbatim"
    stage: conformance
    tests: [D-CHAINZIP]
    threshold: all pass

  - id: C-LAYERS
    claim: "Final artifacts carry the five handoff layers (spec §22): L1-L4 by construction; L5 once flows declare requirements"
    stage: agentic
    metric: layers_score          # from B-LAYERS rubric applied to each agentic final
    threshold: ">= 4 of 5, L1-L4 all green"
    expect: red                   # L5 red until a flow exercises patch-requirements (TESTBOOK B-LAYERS flip plan)
    note: "ad-hoc baseline 1-2.5/5 (research/14 §3) — record the gap"

  - id: C-DELTA
    claim: "Delta-per-hop injection keeps per-hop injected size ~flat on sequential chains"
    stage: planned                # blocked on v1.2 `read agent --since` (research/13 OQ2)
  - id: C-CACHE
    claim: "The byte-stable guide produces real provider prompt-cache hits across agent invocations"
    stage: planned                # P-CACHE, needs provider API verification (research/13 OQ3)

  # ---- benchmark claims (agentic, stage 2; numbers from metrics-lite.json) ----
  - id: C-REVISION-TOKENS
    claim: "Revision-loop pipelines: CLAN patch path authors materially fewer output chars than ad-hoc file editing at equal fidelity"
    stage: agentic
    metric: h1_output_ratio        # sum(clan authored) / sum(adhoc authored)
    threshold: "<= 0.65"           # lite bar; HEAVY target <= 0.50 (research/15)
    baseline: 0.65                 # lite run 2026-06-11: 2587/3966 = 0.652 (pre-F14/F15)
    note: "F14 --append should push this down; F15 required attribution pushes up. Re-run decides."

  - id: C-PROV-E2E
    claim: "A revision pipeline's final chain attributes every mutating hop"
    stage: agentic
    metric: h1_chain_entries_vs_hops   # n_decisions / n_mutating_hops
    threshold: ">= 1.0"
    expect: red->green             # was 1/8 pre-F15; F15 should fix — first post-fix run flips it
    note: "The lite pass's F15 discovery. THE provenance regression check."

  - id: C-CROSSOVER
    claim: "Sequential chains: CLAN distilled re-injection beats ad-hoc accumulating re-reads as chains lengthen (crossover by ~hop 10)"
    stage: agentic
    metric: h2_crossover_hop
    threshold: "<= 10"
    expect: red                    # lite run: no crossover by hop 10 (clan slope steeper). HEAVY (richer hops) must settle; claim may need re-scoping to synthesis-hop win.

  - id: C-SYNTH-WIN
    claim: "At the synthesis hop, CLAN's merged injection beats ad-hoc re-reading all inputs"
    stage: agentic
    metric: h2_synth_ratio         # clan synth injected / adhoc synth injected
    threshold: "< 1.0"
    baseline: 0.776                # lite run 2026-06-11

  - id: C-FIDELITY
    claim: "Nothing is silently lost: all requested edits present in final, untouched fields byte-stable, file validates"
    stage: agentic
    metric: h1_fidelity
    threshold: "== 1.0"

  - id: C-RELIABILITY
    claim: "Agents recover from every CLI error without orchestrator help"
    stage: agentic
    metric: unrecovered_failures
    threshold: "== 0"

  # ---- claims tracked but NOT covered by this pipeline's lite stages ----
  - id: C-TEACHABLE
    claim: "Unguided agents reach protocol competence from agent-help alone"
    stage: manual
    evidence: research/14 (flows 02/06; zero guard violations)
    cadence: re-verify each minor version (TESTBOOK B-UNGUIDED, ~100k tokens)

  - id: C-HITL
    claim: "Human involvement is provable in the artifact (edited_by, patch fold-in)"
    stage: manual
    evidence: research/14 flow-09 vs flow-10; F5 fix
    cadence: re-verify on viewer releases (TESTBOOK B-HITL)

  - id: C-METAMORPHOSIS
    claim: "One document can transform radically per hop (view + schema) with zero context loss"
    stage: manual
    evidence: research/14 flow-11
    cadence: re-verify on spec changes touching pack-html/--schema/assets (TESTBOOK B-META)

  - id: C-RESUME
    claim: "Cold resume from a single file beats resuming from a directory"
    stage: planned            # TESTBOOK L-H3 — not yet run
  - id: C-XVENDOR
    claim: "The artifact survives a vendor/model boundary; conventions don't"
    stage: planned            # TESTBOOK L-H4 — not yet run
