[package]
name = "clan-app"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clan-sdk = { path = "../../crates/clan-sdk" }
tempfile = "3"
